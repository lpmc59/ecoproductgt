server {
    listen 80;
    server_name ecoproductgt.com www.ecoproductgt.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ecoproductgt.com www.ecoproductgt.com;

    ssl_certificate /etc/letsencrypt/live/ecoproductgt.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ecoproductgt.com/privkey.pem;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    client_max_body_size 50M;

    location / {
        proxy_pass http://host.docker.internal:6001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
